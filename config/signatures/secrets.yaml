signatures:
  - id: google-api-key
    name: Google API Key
    pattern: 'AIza[0-9A-Za-z\\-_]{35}'
    severity: high
    description: "Kunci API Google Cloud/Maps terdeteksi secara publik."
    kind: secret

  - id: aws-access-key
    name: AWS Access Key
    pattern: 'AKIA[0-9A-Z]{16}'
    severity: critical
    description: "AWS Access Key ID ditemukan. Potensi akses ke infrastruktur cloud."
    kind: secret

  - id: stripe-key
    name: Stripe API Key
    pattern: '(sk|pk)_(test|live)_[0-9a-zA-Z]{24}'
    severity: critical
    description: "Kunci API Stripe (Komersial/Payment) terdeteksi."
    kind: secret

  - id: discord-token
    name: Discord Token
    pattern: '[MN][A-Za-z\\d]{23}\\.[\\w-]{6}\\.[\\w-]{27}'
    severity: high
    description: "Token bot/user Discord ditemukan."
    kind: secret

  - id: slack-webhook
    name: Slack Webhook
    pattern: 'https://hooks.slack.com/services/T[0-9A-Z]{8}/B[0-9A-Z]{8}/[0-9a-zA-Z]{24}'
    severity: high
    description: "Incoming Webhook Slack ditemukan."
    kind: secret

  - id: generic-secret
    name: Generic Secret/Password
    pattern: '(?i)(password|secret|api_key|apikey|token|private_key|internal_api)[\s:=]+[\"''\s]?([a-zA-Z0-9_\-]{8,64})[\"''\s]?'
    severity: medium
    description: "Kata kunci sensitif (password/secret) terdeteksi dalam kode."
    kind: secret
